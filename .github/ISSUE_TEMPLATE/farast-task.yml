name: FARAST task
description: Create one canonical, traceable work item for the multi-chat agent team.
title: "[FARAST-TASK] "
labels: []
body:
  - type: markdown
    attributes:
      value: |
        Use one issue per distinct task. Search existing issues before creating a duplicate. This issue is the shared task record for all FARAST conversations.
  - type: textarea
    id: objective
    attributes:
      label: Objective and problem
      description: State the required outcome and evidence-based context.
    validations:
      required: true
  - type: input
    id: work_item_id
    attributes:
      label: Stable Work Item ID
      description: Stable across chats, accounts and RUN_ID changes; never reuse for a different leaf.
      placeholder: WI-EXP03-001
    validations:
      required: true
  - type: input
    id: parent_goal_ids
    attributes:
      label: Parent Goal IDs
      placeholder: G-01
    validations:
      required: true
  - type: input
    id: parent_exp_ids
    attributes:
      label: Parent EXP IDs
      placeholder: EXP-03
    validations:
      required: true
  - type: input
    id: priority
    attributes:
      label: Priority (0-100; lower is higher)
      placeholder: "50"
    validations:
      required: true
  - type: dropdown
    id: write_policy
    attributes:
      label: Write policy
      description: Product repository tasks remain READ_ONLY unless the owner explicitly authorizes writes.
      options:
        - READ_ONLY
        - WRITE_REQUIRES_OWNER_APPROVAL
        - WRITE_ALLOWED
      default: 1
    validations:
      required: true
  - type: dropdown
    id: priority_source
    attributes:
      label: Priority source
      options:
        - DEFAULT_POLICY
        - OWNER_ASSIGNED
      default: 1
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope and constraints
      description: Include in-scope, out-of-scope, preservation requirements, and stop conditions.
    validations:
      required: true
  - type: input
    id: effort_estimate_minutes
    attributes:
      label: Target focused effort (minutes)
      description: Target 20-30 minutes of substantive work; do not force artificial waiting.
      placeholder: "25"
    validations:
      required: true
  - type: textarea
    id: depth_profile
    attributes:
      label: Depth profile
      description: Minimum 6 substantive steps, 4 acceptance criteria and 3 deliverables; include profile version and rationale.
      placeholder: |
        profile_version: 2.0.0
        min_substantive_steps: 6
        min_acceptance_criteria: 4
        min_deliverables: 3
        target_effort_minutes: 25
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Observable and testable conditions.
    validations:
      required: true
  - type: input
    id: target_repository
    attributes:
      label: Target repository (owner/name)
      description: Exact GitHub repository where this task's code or artifacts will be changed.
      placeholder: a4adelahmadian86-wq/farast-control-plane
    validations:
      required: true
  - type: textarea
    id: resource_keys
    attributes:
      label: Resource keys
      description: Canonical shared resource keys, one per line. Example module:payments or file:app/Services/PaymentService.php. Do not use broad wildcards without approval.
      placeholder: |
        module:payments
        file:app/Services/PaymentService.php
    validations:
      required: true
  - type: input
    id: work_order_id
    attributes:
      label: Work Order ID and EXP stage
      placeholder: WO-EXP-02-003 / EXP-02
    validations:
      required: true
  - type: input
    id: accountable_role
    attributes:
      label: Accountable specialist role
      placeholder: FAR-REPO
    validations:
      required: true
  - type: textarea
    id: ordered_steps
    attributes:
      label: Ordered execution steps
    validations:
      required: true
  - type: textarea
    id: deliverables
    attributes:
      label: Exact deliverables and evidence
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Validation procedure
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies, rollback and handoff
    validations:
      required: false

  - type: textarea
    id: work_item_specification_json
    attributes:
      label: Work item specification JSON
      description: Valid JSON conforming to 04_COORDINATION/WORK_ITEM_SCHEMA.json. Include 6+ substantive steps, expected_output/evidence_requirement for each, 4+ criteria, 3+ deliverables, depth_profile and effort_estimate_minutes. Do not mark anything PASS at creation.
      placeholder: |
        {
          "schema_version": "1.0",
          "write_policy": "READ_ONLY",
          "priority_source": "DEFAULT_POLICY",
          "work_item_id": "WI-EXP03-001",
          "title": "Example leaf task",
          "parent_goal_ids": ["G-01"],
          "parent_exp_ids": ["EXP-03"],
          "status": "READY",
          "target_repository": "a4adelahmadian86-wq/farast-control-plane",
          "resource_keys": ["module:capability-catalog"],
          "dependencies": [],
          "effort_estimate_minutes": 25,
          "effort_rationale": "Focused discovery, cross-check, analysis and read-back.",
          "depth_profile": {"profile_version":"2.0.0","min_substantive_steps":6,"min_acceptance_criteria":4,"min_deliverables":3,"target_effort_minutes":25},
          "steps": [
            {"step_id":"S1_DISCOVER","title":"Inspect the primary evidence","expected_output":"Evidence inventory","evidence_requirement":"Exact GitHub URL or UNKNOWN","estimate_minutes":4},
            {"step_id":"S2_MAP","title":"Map related components","expected_output":"Component map","evidence_requirement":"Source references","estimate_minutes":4},
            {"step_id":"S3_ANALYZE","title":"Analyze behavior and constraints","expected_output":"Analysis notes","evidence_requirement":"Evidence-backed findings","estimate_minutes":4},
            {"step_id":"S4_CROSSCHECK","title":"Cross-check claims against independent sources","expected_output":"Cross-check matrix","evidence_requirement":"Two source types where possible","estimate_minutes":4},
            {"step_id":"S5_ASSESS","title":"Assess risks and unknowns","expected_output":"Risk/unknown register","evidence_requirement":"Source-backed risk entries","estimate_minutes":3},
            {"step_id":"S6_REPORT","title":"Produce the deliverables","expected_output":"Task artifacts","evidence_requirement":"Artifact URLs","estimate_minutes":3},
            {"step_id":"S7_VERIFY","title":"Read back and verify the outputs","expected_output":"Verification record","evidence_requirement":"Read-back URLs","estimate_minutes":3}
          ],
          "acceptance_criteria": [
            {"criterion_id":"AC_SCOPE","title":"All required steps completed or blocked with evidence"},
            {"criterion_id":"AC_EVIDENCE","title":"Every factual conclusion has a traceable evidence reference"},
            {"criterion_id":"AC_OUTPUT","title":"All required deliverables exist and were read back"},
            {"criterion_id":"AC_POLICY","title":"Write policy, dependencies and safety boundaries were respected"}
          ],
          "deliverables": [
            {"deliverable_id":"D1","description":"Primary task artifact","evidence_requirement":"GitHub URL"},
            {"deliverable_id":"D2","description":"Evidence and unknowns register","evidence_requirement":"GitHub URL"},
            {"deliverable_id":"D3","description":"Final report and next action","evidence_requirement":"GitHub URL"}
          ],
          "priority": 50,
          "created_at_utc": "2026-11-14T00:00:00Z"
        }
    validations:
      required: true
