name: Control Plane Validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required control-plane files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            START_HERE.md
            00_PROJECT_FOUNDATION/PROJECT_CHARTER.md
            00_PROJECT_FOUNDATION/APPROVED_REQUIREMENTS.md
            00_PROJECT_FOUNDATION/SPECIALIST_WORKFLOW.md
            01_STRATEGY/GOAL_TREE.md
            01_STRATEGY/ROADMAP.md
            02_GOVERNANCE/DECISION_REGISTER.md
            02_GOVERNANCE/USER_FEEDBACK_REGISTER.md
            03_PROJECT_STATE/MASTER_STATUS.md
            04_COORDINATION/WORKER_PROTOCOL.md
            04_COORDINATION/LOCK_PROTOCOL.md
            04_COORDINATION/TASK_SCHEMA.md
            05_PROMPT_LIBRARY/MASTER-00.md
            05_PROMPT_LIBRARY/PROMPT_CATALOG.md
          )
          for f in "${required[@]}"; do
            test -s "$f" || { echo "Missing/empty: $f"; exit 1; }
          done
      - name: Check prompt library coverage
        shell: bash
        run: |
          set -euo pipefail
          for n in $(seq -w 1 17); do
            count=$(find 05_PROMPT_LIBRARY -maxdepth 1 -type f -name "PR-$n*.md" | wc -l)
            test "$count" -eq 1 || { echo "Expected one PR-$n prompt, found $count"; exit 1; }
          done
