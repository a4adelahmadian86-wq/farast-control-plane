name: Control Plane Validation
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check required control-plane files
        shell: bash
        run: |
          set -euo pipefail
          required=(
            START_HERE.md
            README.md
            USAGE_GUIDE_FA.md
            00_PROJECT_FOUNDATION/PROJECT_CHARTER.md
            00_PROJECT_FOUNDATION/APPROVED_REQUIREMENTS.md
            00_PROJECT_FOUNDATION/SOURCE_REQUIREMENTS_v2.md
            00_PROJECT_FOUNDATION/CONTROL_PLANE_REQUIREMENTS.md
            00_PROJECT_FOUNDATION/SPECIALIST_WORKFLOW.md
            00_PROJECT_FOUNDATION/ARCHITECTURE_COVERAGE.md
            01_STRATEGY/GOAL_TREE.md
            01_STRATEGY/ROADMAP.md
            01_STRATEGY/DEPENDENCY_GRAPH.json
            01_STRATEGY/EXECUTION_DECOMPOSITION_17x27.md
            02_GOVERNANCE/DECISION_REGISTER.md
            02_GOVERNANCE/USER_FEEDBACK_REGISTER.md
            03_PROJECT_STATE/MASTER_STATUS.md
            04_COORDINATION/WORKER_PROTOCOL.md
            04_COORDINATION/LOCK_PROTOCOL.md
            04_COORDINATION/LOCK_MANAGER_PROTOCOL.md
            04_COORDINATION/INTERRUPTION_RECOVERY_PROTOCOL.md
            04_COORDINATION/MULTI_AGENT_REGRESSION_CASES.md
            04_COORDINATION/MANUAL_GITHUB_SETTINGS.md
            04_COORDINATION/ACTIVE_LOCKS.schema.json
            04_COORDINATION/TASK_SCHEMA.md
            04_COORDINATION/WORK_ORDER_SCHEMA.json
            04_COORDINATION/CHECKPOINT_SCHEMA.json
            04_COORDINATION/HANDOFF_PROTOCOL.md
            04_COORDINATION/ACCEPTANCE_FRAMEWORK.md
            04_COORDINATION/LEGACY_COORDINATOR_MIGRATION.md
            04_COORDINATION/COORDINATOR_COMMANDS.md
            04_COORDINATION/MULTI_CHAT_READINESS.md
            04_COORDINATION/ACTOR_AUTHORIZATION.json
            04_COORDINATION/COORDINATOR_TEST_PLAN.md
            .github/workflows/farast-coordinator.yml
            .github/scripts/coordinator-core.js
            .github/scripts/coordinator-core.test.js
            .github/scripts/work-item-core.js
            .github/scripts/work-item-core.test.js
            .github/scripts/work-item-dispatch-core.js
            .github/scripts/work-item-dispatch-core.test.js
            04_COORDINATION/WORK_ITEM_SCHEMA.json
            04_COORDINATION/WORK_ITEM_CHECKPOINT_SCHEMA.json
            04_COORDINATION/WORK_ITEM_EXECUTION_PROTOCOL.md
            04_COORDINATION/WORK_ITEM_DEPTH_STANDARD.md
            04_COORDINATION/PROGRESS_REPORTING_PROTOCOL.md
            04_COORDINATION/SINGLE_PROMPT_MULTI_CHAT_DISPATCH.md
            .github/ISSUE_TEMPLATE/farast-task.yml
            .github/PULL_REQUEST_TEMPLATE.md
            .github/CODEOWNERS
            05_PROMPT_LIBRARY/MASTER-00.md
            05_PROMPT_LIBRARY/PROMPT_CATALOG.md
            05_PROMPT_LIBRARY/FARAST_EXECUTABLE_PROMPTS_COMPLETE.md
            BOOTSTRAP_STATUS.md
          )
          for f in "${required[@]}"; do
            test -s "$f" || { echo "Missing/empty: $f"; exit 1; }
          done
      - name: Run multi-chat contention and fencing fixtures
        run: node --test .github/scripts/coordinator-core.test.js
      - name: Run hierarchical work item progress, fairness and resume fixtures
        run: node --test .github/scripts/work-item-core.test.js
      - name: Run deterministic specialist prompt dispatch fixtures
        run: node --test .github/scripts/work-item-dispatch-core.test.js
      - name: Validate JSON and all prompt bootstrap contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install 'jsonschema==4.23.0' 'PyYAML==6.0.2'
          python - <<'PY'
          import yaml, subprocess, tempfile
          from pathlib import Path
          source = Path('.github/workflows/farast-coordinator.yml').read_text(encoding='utf-8')
          yaml.safe_load(source)
          yaml.safe_load(Path('.github/ISSUE_TEMPLATE/farast-task.yml').read_text(encoding='utf-8'))
          lines = source.splitlines()
          start = next(i for i, line in enumerate(lines) if line.strip() == 'script: |')
          block = []
          for line in lines[start + 1:]:
              if line.strip() and len(line) - len(line.lstrip()) < 12:
                  break
              block.append(line[12:] if line.startswith('            ') else line)
          script = '\n'.join(block)
          with tempfile.NamedTemporaryFile(mode='w', suffix='.js', encoding='utf-8') as f:
              f.write('async function __coordinator(){\n' + script + '\n}\n'); f.flush()
              subprocess.run(['node', '--check', f.name], check=True)
          print('Coordinator YAML and JavaScript syntax passed.')
          PY
          python - <<'PY'
          import json
          from jsonschema import Draft202012Validator, FormatChecker
          from pathlib import Path
          json.loads(Path("01_STRATEGY/DEPENDENCY_GRAPH.json").read_text(encoding="utf-8"))
          json.loads(Path("04_COORDINATION/ACTIVE_LOCKS.schema.json").read_text(encoding="utf-8"))
          work_item_schema = json.loads(Path("04_COORDINATION/WORK_ITEM_SCHEMA.json").read_text(encoding="utf-8"))
          work_item_checkpoint_schema = json.loads(Path("04_COORDINATION/WORK_ITEM_CHECKPOINT_SCHEMA.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(work_item_schema)
          Draft202012Validator.check_schema(work_item_checkpoint_schema)
          auth_policy = json.loads(Path("04_COORDINATION/ACTOR_AUTHORIZATION.json").read_text(encoding="utf-8"))
          assert set(auth_policy["roles"]) >= {"OWNER", "SENIOR_MANAGER", "WORKER", "READ_ONLY"}
          assert isinstance(auth_policy["actor_scopes"], dict)
          assert "refresh" in auth_policy["roles"]["OWNER"] and "refresh" not in auth_policy["roles"]["WORKER"]
          assert {"progress", "step", "criterion", "checkpoint"}.issubset(set(auth_policy["roles"]["WORKER"]))
          assert "accept" not in auth_policy["roles"]["WORKER"] and "status" in auth_policy["roles"]["READ_ONLY"]
          work_schema = json.loads(Path("04_COORDINATION/WORK_ORDER_SCHEMA.json").read_text(encoding="utf-8"))
          checkpoint_schema = json.loads(Path("04_COORDINATION/CHECKPOINT_SCHEMA.json").read_text(encoding="utf-8"))
          Draft202012Validator.check_schema(work_schema)
          Draft202012Validator.check_schema(checkpoint_schema)
          work_item_sample = {"schema_version":"1.0","write_policy":"READ_ONLY","priority_source":"DEFAULT_POLICY","work_item_id":"WI-CI-001","title":"CI work item","parent_goal_ids":["G-09"],"parent_exp_ids":["EXP-01"],"status":"READY","target_repository":"owner/repo","resource_keys":["module:ci"],"dependencies":[],"steps":[{"step_id":"S1","title":"Inspect"}],"acceptance_criteria":[{"criterion_id":"AC1","title":"Evidence exists"}],"priority":50,"created_at_utc":"2026-11-14T00:00:00Z"}
          work_item_checkpoint_sample = {"work_item_id":"WI-CI-001","run_id":"RUN-CI-001","checkpoint_version":1,"created_at_utc":"2026-11-14T00:00:00Z","last_verified_step_id":None,"current_step_id":"S1","completed_step_ids":[],"remaining_step_ids":["S1"],"progress_percentage":0,"evidence_refs":[],"blockers":[],"owner":{"actor":"ci","chat_id":"ci-chat","fencing_token":1,"lease_expires_at_utc":"2026-11-14T01:00:00Z"},"next_action":"inspect"}
          Draft202012Validator(work_item_schema, format_checker=FormatChecker()).validate(work_item_sample)
          deep_sample = {**work_item_sample,
            "effort_estimate_minutes":25,
            "effort_rationale":"Focused 25-minute discovery and verification task.",
            "depth_profile":{"profile_version":"2.0.0","min_substantive_steps":6,"min_acceptance_criteria":4,"min_deliverables":3,"target_effort_minutes":25},
            "steps":[{"step_id":f"S{i+1}","title":f"Step {i+1}","expected_output":"Output","evidence_requirement":"GitHub evidence","estimate_minutes":4} for i in range(6)],
            "acceptance_criteria":[{"criterion_id":f"AC{i+1}","title":f"Criterion {i+1}","evidence_requirement":"Evidence ref"} for i in range(4)],
            "deliverables":[{"deliverable_id":f"D{i+1}","description":f"Deliverable {i+1}","evidence_requirement":"GitHub URL"} for i in range(3)]
          }
          Draft202012Validator(work_item_schema, format_checker=FormatChecker()).validate(deep_sample)
          Draft202012Validator(work_item_checkpoint_schema, format_checker=FormatChecker()).validate(work_item_checkpoint_sample)
          checkpoint_v2 = {**work_item_checkpoint_sample,
            "execution_progress_percentage":0,
            "acceptance_progress_percentage":0,
            "overall_completion_percentage":0,
            "progress_calculation_version":"PROGRESS_V2",
            "required_step_counts":{"not_run":1},
            "acceptance_criteria_counts":{"not_run":1}
          }
          Draft202012Validator(work_item_checkpoint_schema, format_checker=FormatChecker()).validate(checkpoint_v2)
          Draft202012Validator.check_schema(work_item_schema)
          Draft202012Validator.check_schema(work_item_checkpoint_schema)
          work_sample = {"TASK_ID":"FCP-EXP03-001","PROMPT_ID":"PR-03","EXP_IDS":["EXP-03"],"GOAL_IDS":["G-01"],"TITLE":"Sample","PURPOSE":"Schema validation fixture","STATUS":"READY","RESOURCE_KEYS":["module:sample"],"SCOPE_IN":["read-only inventory"],"SCOPE_OUT":["production changes"],"ACCEPTANCE_CRITERIA":["evidence linked"],"NEXT_ACTION":"inspect evidence"}
          checkpoint_sample = {"TASK_ID":"FCP-EXP03-001","PROMPT_ID":"PR-03","RUN_ID":"RUN-SAMPLE-001","OPERATION_ID_LAST_CONFIRMED":None,"RECOVERY_STATE":"CONFIRMED","AGENT_ALIAS":"ci-fixture","TIMESTAMP_UTC":"2026-11-14T00:00:00Z","TASK_STATUS":"READY","BRANCH":"work/FCP-EXP03-001","COMMIT_SHA":None,"LAST_COMPLETED_STEP":"none","CURRENT_STEP":"fixture","NEXT_ACTION":"resume","EXACT_RESUME_INSTRUCTION":"read task and continue","LAST_GITHUB_READBACK_UTC":None,"PENDING_OPERATION_AND_ID":None,"FILES_CHANGED":[],"COMMANDS_EXECUTED":[],"TESTS_AND_RESULTS":[],"EVIDENCE_LINKS":[],"FACTS_CONFIRMED":[],"ASSUMPTIONS":[],"UNKNOWN":[],"BLOCKERS":[],"RESOURCE_LEASES":[],"HUMAN_APPROVAL":None,"HANDOFF_NOTES":""}
          Draft202012Validator(work_schema, format_checker=FormatChecker()).validate(work_sample)
          Draft202012Validator(checkpoint_schema, format_checker=FormatChecker()).validate(checkpoint_sample)
          import re
          decomposition = Path("01_STRATEGY/EXECUTION_DECOMPOSITION_17x27.md").read_text(encoding="utf-8")
          exp_ids = set(re.findall(r"^### EXP-(\d{2}) —", decomposition, re.M))
          prompt_ids = set(re.findall(r"^\| PR-(\d{2}) \|", decomposition, re.M))
          assert len(exp_ids) == 27, ("Expected 27 deep EXP plans", len(exp_ids))
          assert len(prompt_ids) == 17, ("Expected 17 prompt mappings", len(prompt_ids))
          assert "هدف برنامه‌ریزی هر EXP" in decomposition
          depth_standard = Path("04_COORDINATION/WORK_ITEM_DEPTH_STANDARD.md").read_text(encoding="utf-8")
          progress_protocol = Path("04_COORDINATION/PROGRESS_REPORTING_PROTOCOL.md").read_text(encoding="utf-8")
          assert "حداقل ۶ گام substantive" in depth_standard
          for metric in ("EXECUTION_PROGRESS", "ACCEPTANCE_PROGRESS", "OVERALL_COMPLETION"):
              assert metric in progress_protocol, metric
          assert "effort_estimate_minutes" in work_item_schema["properties"]
          assert "depth_profile" in work_item_schema["properties"]
          assert "deliverables" in work_item_schema["properties"]
          assert "execution_progress_percentage" in work_item_checkpoint_schema["properties"]
          assert "acceptance_progress_percentage" in work_item_checkpoint_schema["properties"]
          assert "overall_completion_percentage" in work_item_checkpoint_schema["properties"]
          prompt_bundle = Path("05_PROMPT_LIBRARY/FARAST_EXECUTABLE_PROMPTS_COMPLETE.md").read_text(encoding="utf-8")
          assert "نسخه: 1.9.0" in prompt_bundle
          assert "قرارداد اجباری عمق مأموریت و گزارش پیشرفت (نسخه 2.0)" in prompt_bundle
          for n in range(1, 18):
              matches = list(Path("05_PROMPT_LIBRARY").glob(f"PR-{n:02d}_*.md"))
              assert len(matches) == 1, (n, matches)
              body = matches[0].read_text(encoding="utf-8")
              for required in ("قرارداد اجباری عمق مأموریت و گزارش پیشرفت (نسخه 2.0)", "EXECUTION_DECOMPOSITION_17x27.md", "WORK_ITEM_DEPTH_STANDARD.md", "PROGRESS_REPORTING_PROTOCOL.md", "START_HERE.md", "LOCK_MANAGER_PROTOCOL.md", "INTERRUPTION_RECOVERY_PROTOCOL.md", "MASTER-00.md", "OPERATION_ID", "AMBIGUOUS", "TASK_ID", "GitHub", "WORK_ITEM_EXECUTION_PROTOCOL.md", "WORK_ITEM_SCHEMA.json", "WI-GOAL-ALLOCATOR-001", "write_policy", "WRITE_REQUIRES_OWNER_APPROVAL", "/farast step", "/farast criterion", "/farast progress", "/farast checkpoint"):
                  assert required in body, (matches[0], required)
              assert "قفل این نسخه اتمیک نیست" not in body, matches[0]
              assert "رجیستری `coordination/locks` فقط توسط workflow مرکزی نوشته می‌شود" in body, matches[0]
              assert "هرگز branch قبلی را دوباره استفاده نکن" in body, matches[0]
              assert "blob/main/START_HERE.md" in body, matches[0]
              assert "ACTOR_AUTHORIZATION.json" in body, matches[0]
              assert "resource_key_prefixes" in body, matches[0]
              assert "بدون درخواست شماره Issue یا تخصیص دستی از مالک" in body, matches[0]
              assert "نامزد بعدی" in body and "Lease انحصاری" in body, matches[0]
              assert "متوقف شو و وضعیت را گزارش کن" not in body, matches[0]
          master = Path("05_PROMPT_LIBRARY/MASTER-00.md").read_text(encoding="utf-8")
          assert "ACTIVE_LOCKS.json" in master
          assert "blob/main/START_HERE.md" in master
          assert "WORK_ITEM_EXECUTION_PROTOCOL.md" in master
          start_here = Path("START_HERE.md").read_text(encoding="utf-8")
          assert "مرجع حقیقت و اجرای کنترل‌پلین" in start_here
          assert "WORK_ITEM_SCHEMA.json" in start_here
          assert "WORK_ORDER_SCHEMA.json" in start_here and "CHECKPOINT_SCHEMA.json" in start_here
          assert "HANDOFF_PROTOCOL.md" in start_here and "ACCEPTANCE_FRAMEWORK.md" in start_here
          coordinator = Path(".github/workflows/farast-coordinator.yml").read_text(encoding="utf-8")
          assert "item.write_policy ||= 'READ_ONLY';\n                item.priority_source ||= 'DEFAULT_POLICY';\n                workItemCore.validateWorkItem(item);" in coordinator
          assert "const formPriorityRaw = scalar('Priority (0-100; lower is higher)');" in coordinator
          assert "formPriorityRaw ? Number(formPriorityRaw) : Number.NaN" in coordinator
          for required in ("farast-control-plane-single-writer", "schedule:", "issue_comment:", "workItemCore", "new github.constructor", "typeof issue === 'number' ? issue : issue.number", "validateProductWriteAuthorization", "Only repository owner may create a write-enabled Work Item", "owner_approval_ref", "recordStepEvidence", "recordCriterionEvidence", "createCheckpoint", "processed_operations", "FARAST_OP_RESPONSE:", "coordination/locks", "pulls.listReviews", "workerActor", "task_already_claimed", "branch_reuse", "claim.previousRun", "next_status: nextStatus", "FARAST_GITHUB_TOKEN", "prUrl", "targetRepositoryFor", "authorizationPolicy", "resourceKeys: resourcesFor(issue)", "coordinatorCore.isCommandAllowed", "coordinatorCore.isSafeRunId", "coordinatorCore.claimResources", "coordinatorCore.ownsLease", "coordinatorCore.renewLease", "coordinatorCore.hasIndependentApproval", "coordinatorCore.matchesReviewLease", "const taskBranch =", "expiredLeases", "event: 'HEARTBEAT'", "if (!accepted && labelsOf(issue).includes('agent:done'))", "else if (!current.length && !['agent:blocked','agent:review','agent:done'].some(x => labelsOf(issue).includes(x)) && !labelsOf(issue).includes('agent:ready'))"):
              assert required in coordinator, required
          assert "require('@actions/github')" not in coordinator
          dispatch_core = Path(".github/scripts/work-item-dispatch-core.js").read_text(encoding="utf-8")
          for required in ("function selectNextWorkItem", "function hardGatesSatisfied", "function hasActiveConflict", "effectivePriority"):
              assert required in dispatch_core, required
          core = Path(".github/scripts/coordinator-core.js").read_text(encoding="utf-8")
          for required in ("agent_alias: args.chatId || args.actor", "target_repository: args.targetRepository", "target_repository: x.target_repository", "function isSafeRunId", "function roleForActor", "function isWithinDelegatedScope", "function isCommandAllowed", "function latestTaskStatus", "function matchesReviewLease", "function claimResources", "function ownsLease", "function renewLease", "task_already_claimed", "branchUsed", "previousRun", "function roleForActor", "function isCommandAllowed"):
              assert required in core, required
          broadcast = Path("04_COORDINATION/SINGLE_PROMPT_MULTI_CHAT_DISPATCH.md").read_text(encoding="utf-8")
          for required in ("همین متن واحد MASTER-00", "توزیع رقابتی", "resource keyهایشان مستقل", "allocator", "RUN_ID", "fencing token", "NOT VERIFIED", "دو حساب مستقل", "بازنده باید وضعیت زنده را دوباره بخواند", "حلقه خودگردان مأموریت", "هیچ سؤال یا درخواست انتخابی از مالک مجاز نیست", "هر حساب ChatGPT باید اتصال GitHub خودش را جداگانه authorize کند", "collaborator/member"):
              assert required in broadcast, required
          master = Path("05_PROMPT_LIBRARY/MASTER-00.md").read_text(encoding="utf-8")
          assert "SINGLE_PROMPT_MULTI_CHAT_DISPATCH.md" in master
          assert "## اجرای یک پرامپت واحد در چند چت (BROADCAST)" in master
          assert "حلقه خودگردان مأموریت" in master
          assert "انتخاب خودکار برای پرامپت تخصصی" in master
          assert "بدون تخصیص دستی" in master
          assert "effective_priority = max(0, priority - floor(age_days))" in master
          assert "منتظر دستور «ادامه بده» یا تخصیص کاربر نمان" in master
          assert "هیچ سؤال یا درخواست انتخابی از مالک مجاز نیست" in master
          assert "هر حساب ChatGPT باید اتصال GitHub خودش را جداگانه authorize کند" in master
          assert "collaborator/member" in master
          start_here = Path("START_HERE.md").read_text(encoding="utf-8")
          assert "SINGLE_PROMPT_MULTI_CHAT_DISPATCH.md" in start_here
          readiness = Path("04_COORDINATION/MULTI_CHAT_READINESS.md").read_text(encoding="utf-8")
          assert "یک پرامپت واحد، چند چت" in readiness
          assert "حلقه خودگردان" in readiness
          assert "MULTI-ACCOUNT E2E NOT VERIFIED" in readiness
          assert "hard-fencing" in readiness
          assert "PR #1 در commit" in readiness
          codeowners = Path(".github/CODEOWNERS").read_text(encoding="utf-8")
          assert "@a4adelahmadian86-wq" in codeowners and "ACTOR_AUTHORIZATION.json" in codeowners
          commands = Path("04_COORDINATION/COORDINATOR_COMMANDS.md").read_text(encoding="utf-8")
          assert "CLAIM GRANTED" in commands and "FENCING_TOKEN" in commands
          for n in range(1, 18):
              p = list(Path("05_PROMPT_LIBRARY").glob(f"PR-{n:02d}_*.md"))[0]
              prompt_text = p.read_text(encoding="utf-8")
              assert "COORDINATOR_COMMANDS.md" in prompt_text, p
              assert "target_repository و branch اختصاصی همان RUN" in prompt_text, p
              assert "branch قبلی را read-only نگه دار" in prompt_text, p
              assert "ACTOR_AUTHORIZATION.json" in prompt_text, p
              assert "resource_key_prefixes" in prompt_text, p
              assert "از طریق CAS آزاد کن" not in prompt_text, p
          legacy = Path("04_COORDINATION/LEGACY_COORDINATOR_MIGRATION.md").read_text(encoding="utf-8")
          assert "PR #479" in legacy and "CAS" in legacy
          assert "LEGACY_COORDINATOR_MIGRATION.md" in start_here
          catalog = Path("05_PROMPT_LIBRARY/PROMPT_CATALOG.md").read_text(encoding="utf-8")
          assert "| PR-02 | PR-02_RECOVERY.md | EXP-02 |" in catalog
          assert "| PR-14 | PR-14_HOSTING_OPERATIONS.md | EXP-16,17,18 |" in catalog
          assert "INTERRUPTION_RECOVERY_PROTOCOL.md" in master
          assert "OPERATION_ID" in master and "AMBIGUOUS" in master
          checkpoint = Path("04_COORDINATION/CHECKPOINT_TEMPLATE.md").read_text(encoding="utf-8")
          assert "OPERATION_ID_LAST_CONFIRMED" in checkpoint
          bundle = Path("05_PROMPT_LIBRARY/FARAST_EXECUTABLE_PROMPTS_COMPLETE.md").read_text(encoding="utf-8")
          assert "نسخه: 1.9.0" in bundle
          source_paths = [Path("05_PROMPT_LIBRARY/MASTER-00.md"), *sorted(Path("05_PROMPT_LIBRARY").glob("PR-*.md"))]
          assert len(source_paths) == 18
          for source_path in source_paths:
              source_block = f"# SOURCE: {source_path.as_posix()}\n\n{source_path.read_text(encoding='utf-8').rstrip()}\n"
              assert source_block in bundle, f"bundle source mismatch: {source_path}"
          assert bundle.count("# SOURCE: 05_PROMPT_LIBRARY/") == 18
          assert bundle.count("# PR-") >= 17
          assert "ACTOR_AUTHORIZATION.json" in bundle
          assert "رجیستری `coordination/locks` فقط توسط workflow مرکزی نوشته می‌شود" in bundle
          assert bundle.count("INTERRUPTION_RECOVERY_PROTOCOL.md") >= 1
          assert bundle.count("blob/main/START_HERE.md") >= 17
          assert "WORK_ITEM_EXECUTION_PROTOCOL.md" in bundle
          assert "/farast step" in bundle and "/farast checkpoint" in bundle
          assert "- EXP: EXP-02, EXP-17" not in bundle
          assert "این مخزن فعلاً فاقد سرویس قفل مستقل است" not in Path("00_PROJECT_FOUNDATION/KNOWN_UNKNOWN.md").read_text(encoding="utf-8")
          for metric in ("EXECUTION_PROGRESS=", "ACCEPTANCE_PROGRESS=", "OVERALL_COMPLETION="):
              assert metric in coordinator, metric
          assert "formEffortRaw = scalar('Target focused effort (minutes)');" in coordinator
          assert "formEffort !== item.effort_estimate_minutes" in coordinator
          for required in ("refresh", "WORK_ITEM_REFRESHED"):
              assert required in coordinator, required

          print("Control-plane documents, JSON, and prompt bootstrap contracts passed.")
          PY
