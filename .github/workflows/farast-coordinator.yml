name: FARAST durable multi-chat coordinator

on:
  issues:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
    inputs:
      issue_number:
        description: 'Optional exact Issue number to reconcile instead of scanning one inbox page'
        required: false
        type: string
      retry_comment_id:
        description: 'Owner-only replay of a previously blocked /farast accept comment; requires its exact comment ID'
        required: false
        type: string

# Serialize events for the same Issue, but let unrelated Issues reconcile in parallel.
# The shared registry is protected by a non-force fast-forward compare-and-swap:
# only one writer based on a given registry commit can advance the ref. A stale
# writer fails without marking its command processed; the durable inbox retries it.
# GitHub may replace a pending run within one Issue group; scheduled reconciliation
# recovers the durable comment. Different Issues do not cancel one another.
concurrency:
  group: farast-control-plane-${{ github.event.issue.number || github.event.number || github.event_name }}
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: write
  checks: read
  statuses: read

jobs:
  coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Reconcile durable command inbox and central lock registry
        uses: actions/github-script@v7
        env:
          FARAST_GITHUB_TOKEN: ${{ secrets.FARAST_GITHUB_TOKEN }}
          FARAST_RULESET_READ_TOKEN: ${{ secrets.FARAST_RULESET_READ_TOKEN }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const coordinatorCore = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/coordinator-core.js');
            const workItemCore = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/work-item-core.js');
            const inboxScheduler = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/inbox-scheduler.js');
            const dependencyGraph = JSON.parse(require('fs').readFileSync(process.env.GITHUB_WORKSPACE + '/01_STRATEGY/DEPENDENCY_GRAPH.json', 'utf8'));
            const authorizationPolicy = require(process.env.GITHUB_WORKSPACE + '/04_COORDINATION/ACTOR_AUTHORIZATION.json');
            const registryBranch = 'coordination/locks';
            const crossRepoGithub = process.env.FARAST_GITHUB_TOKEN ? new github.constructor({ auth: process.env.FARAST_GITHUB_TOKEN }) : null;
            // GITHUB_TOKEN has no Administration:read scope. Read bypass actors with a
            // dedicated least-privilege token; without it, ruleset validation stays fail-closed.
            const rulesetReadGithub = process.env.FARAST_RULESET_READ_TOKEN
              ? new github.constructor({ auth: process.env.FARAST_RULESET_READ_TOKEN })
              : github;
            // Fine-grained PATs do not authenticate the Checks API. For cross-repository
            // acceptance, read check runs anonymously only when the target repository is
            // public. Private targets fail closed here and require a future GitHub App
            // installation-token integration with Checks:read.
            const crossRepoChecksGithub = new github.constructor();
            const registryPath = '04_COORDINATION/ACTIVE_LOCKS.json';
            const allowedAssociations = new Set(['OWNER', 'COLLABORATOR', 'MEMBER']);
            const labelDefs = [
              { name: 'agent:task', color: '1D4ED8', description: 'Canonical FARAST task record' },
              { name: 'agent:ready', color: '0E8A16', description: 'Ready for an authorized worker to claim' },
              { name: 'agent:locked', color: 'B60205', description: 'One or more central resource leases are active' },
              { name: 'agent:blocked', color: 'D93F0B', description: 'Blocked pending resolution' },
              { name: 'agent:review', color: 'FBCA04', description: 'Implementation complete; automated checks and acceptance pending' },
              { name: 'agent:done', color: '5319E7', description: 'Accepted after exact-head automated checks and merge' }
            ];

            for (const label of labelDefs) {
              try { await github.rest.issues.createLabel({ owner, repo, ...label }); }
              catch (e) { if (e.status !== 422) throw e; }
            }

            const getRegistry = async () => {
              const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + registryBranch });
              const commit = await github.rest.git.getCommit({ owner, repo, commit_sha: ref.data.object.sha });
              const tree = await github.rest.git.getTree({ owner, repo, tree_sha: commit.data.tree.sha, recursive: '1' });
              const entry = tree.data.tree.find(x => x.path === registryPath && x.type === 'blob');
              if (!entry) throw new Error('STOP: central lock registry missing');
              const blob = await github.rest.git.getBlob({ owner, repo, file_sha: entry.sha });
              const decoded = Buffer.from(blob.data.content, 'base64').toString('utf8');
              return { state: JSON.parse(decoded), refSha: ref.data.object.sha, treeSha: commit.data.tree.sha };
            };

            // This workflow is the sole authorized writer. Different Issue events may
            // execute concurrently, but saveRegistry advances the shared ref with a
            // non-force fast-forward CAS. A stale writer must fail and leave its command
            // unprocessed so the durable inbox can replay it; workers never write directly.
            const saveRegistry = async (state, snapshot, message) => {
              state.revision = (state.revision || 0) + 1;
              const blob = await github.rest.git.createBlob({
                owner, repo, content: JSON.stringify(state, null, 2) + '\n', encoding: 'utf-8'
              });
              const tree = await github.rest.git.createTree({
                owner, repo, base_tree: snapshot.treeSha,
                tree: [{ path: registryPath, mode: '100644', type: 'blob', sha: blob.data.sha }]
              });
              const commit = await github.rest.git.createCommit({
                owner, repo, message, tree: tree.data.sha, parents: [snapshot.refSha]
              });
              // A successful ref update is durable; GitHub reads may briefly lag.
              // Accept only a read-back that confirms this exact commit SHA.
              try {
                await github.rest.git.updateRef({
                  owner, repo, ref: 'heads/' + registryBranch, sha: commit.data.sha, force: false
                });
              } catch (error) {
                const latest = await getRegistry();
                if (latest.refSha !== snapshot.refSha) {
                  throw new Error('registry_cas_conflict: another Issue advanced the shared registry; this command remains durable and must be replayed. latest=' + latest.refSha + '; cause=' + error.message);
                }
                throw error;
              }
              for (let attempt = 0; attempt < 4; attempt++) {
                const readBack = await getRegistry();
                if (readBack.refSha === commit.data.sha) return readBack;
                if (attempt < 3) await new Promise(resolve => setTimeout(resolve, 250 * (attempt + 1)));
              }
              throw new Error('registry_readback_commit_mismatch: committed=' + commit.data.sha + '; durable operation remains in the inbox for reconciliation');

            };

            const labelsOf = issue => (issue.labels || []).map(x => typeof x === 'string' ? x : x.name);
            const isTask = issue => issue.title.startsWith('[FARAST-TASK]') || labelsOf(issue).includes('agent:task');
            const addLabel = (n, name) => github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: [name] });
            const removeLabel = async (n, name) => {
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name }); }
              catch (e) { if (e.status !== 404) throw e; }
            };
            const setStatus = async (issue, status) => {
              const n = typeof issue === 'number' ? issue : issue.number;
              for (const name of ['agent:ready','agent:locked','agent:blocked','agent:review','agent:done']) await removeLabel(n, name);
              if (status !== 'task') await addLabel(n, 'agent:' + status);
            };
            const publish = (n, body) => github.rest.issues.createComment({ owner, repo, issue_number: n, body });

            const parseArgs = s => {
              const out = {};
              for (const m of s.matchAll(/([a-z_]+)=("[^"]*"|'[^']*'|[^\s]+)/g)) out[m[1]] = m[2].replace(/^["']|["']$/g, '');
              return out;
            };
            const resourcesFor = issue => coordinatorCore.resourcesFor(issue.body, issue.number);
            const targetRepositoryFor = issue => coordinatorCore.targetRepositoryFor(issue.body);
            const activeForIssue = (state, n) => coordinatorCore.activeForIssue(state, n);
            const expireLocks = state => coordinatorCore.expireLocks(state);
            const LEGACY_ALLOCATION_PROVENANCE_MAX_ISSUE = 90;
            const workItemSpecFor = issue => {
              const match = (issue.body || '').match(/(?:^|\n)###\s*Work item specification JSON\s*\n([\s\S]*?)(?=\n###|$)/i);
              if (!match) return null;
              const raw = match[1].trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
              try {
                const item = JSON.parse(raw);
                // Backward-compatible, fail-closed defaults for pre-policy Work Items.
                item.write_policy ||= 'READ_ONLY';
                item.priority_source ||= 'DEFAULT_POLICY';
                workItemCore.validateWorkItem(item);
                const scalar = label => {
                  const body = issue.body || '';
                  const at = body.indexOf('### ' + label);
                  if (at < 0) return '';
                  const start = body.indexOf('\n', at) + 1;
                  const next = body.indexOf('\n###', start);
                  return body.slice(start, next < 0 ? undefined : next).trim();
                };
                const formId = scalar('Stable Work Item ID');
                const formTarget = targetRepositoryFor(issue);
                const formResources = resourcesFor(issue);
                const formGoals = scalar('Parent Goal IDs').split(/[\n,;]+/).map(x => x.trim()).filter(Boolean).sort();
                const formExps = scalar('Parent EXP IDs').split(/[\n,;]+/).map(x => x.trim()).filter(Boolean).sort();
                const formCps = scalar('Parent CP IDs').split(/[\n,;]+/).map(x => x.trim()).filter(Boolean).sort();
                const formPriorityRaw = scalar('Priority (0-100; lower is higher)');
                const formPriority = formPriorityRaw ? Number(formPriorityRaw) : Number.NaN;
                const formEffortRaw = scalar('Target focused effort (minutes)');
                const formEffort = formEffortRaw ? Number(formEffortRaw) : Number.NaN;
                const formWritePolicy = scalar('Write policy');
                const formPrioritySource = scalar('Priority source');
                const specResources = [...new Set((item.resource_keys || []).map(x => String(x).trim().toLowerCase().replace(/\\/g, '/')))].sort();
                if (formId && formId !== item.work_item_id) throw new Error('Stable Work Item ID does not match JSON');
                if (formTarget && formTarget !== item.target_repository) throw new Error('Target repository does not match JSON');
                if (JSON.stringify(formResources) !== JSON.stringify(specResources)) throw new Error('Resource keys do not match JSON');
                if (formGoals.length && JSON.stringify(formGoals) !== JSON.stringify([...(item.parent_goal_ids || [])].sort())) throw new Error('Parent Goal IDs do not match JSON');
                if (formExps.length && JSON.stringify(formExps) !== JSON.stringify([...(item.parent_exp_ids || [])].sort())) throw new Error('Parent EXP IDs do not match JSON');
                if (issue.number > LEGACY_ALLOCATION_PROVENANCE_MAX_ISSUE &&
                    formCps.length &&
                    JSON.stringify(formCps) !== JSON.stringify([...(item.parent_cp_ids || [])].sort())) {
                  throw new Error('Parent CP IDs do not match JSON');
                }
                if (Number.isFinite(formPriority) && formPriority !== item.priority) throw new Error('Priority does not match JSON');
                if (Number.isFinite(formEffort) && formEffort !== item.effort_estimate_minutes) throw new Error('Target focused effort does not match JSON');
                if (formWritePolicy && formWritePolicy !== item.write_policy) throw new Error('Write policy does not match JSON');
                if (formPrioritySource && formPrioritySource !== item.priority_source) throw new Error('Priority source does not match JSON');
                if (item.target_repository === 'a4adelahmadian86-wq/non' && item.write_policy === 'WRITE_ALLOWED') {
                  workItemCore.validateProductWriteAuthorization(item, {
                    repository_owner: owner,
                    issue_author: issue.user?.login || '',
                    issue_url: `https://github.com/${owner}/${repo}/issues/${issue.number}`,
                    issue_body: issue.body || ''
                  });
                }
                if (item.write_policy !== 'READ_ONLY' && issue.user && issue.user.login !== owner) throw new Error('Only repository owner may create a write-enabled Work Item');
                if (item.write_policy === 'WRITE_REQUIRES_OWNER_APPROVAL' && !item.owner_approval_ref) throw new Error('Owner approval evidence reference is required');
                return item;
              } catch (error) {
                throw new Error('Invalid Work item specification JSON in Issue #' + issue.number + ': ' + error.message);
              }
            };
            const ensureAllocationProvenance = (issue, item, state, nowMs = Date.now()) => {
              if (Number(issue.number) <= LEGACY_ALLOCATION_PROVENANCE_MAX_ISSUE) return { ok:true, legacy:true };
              if (!item) return { ok:false, reason:'work_item_spec_missing' };
              if (item.target_repository === 'a4adelahmadian86-wq/farast-control-plane' &&
                  (item.parent_goal_ids || []).includes('G-09') &&
                  (!Array.isArray(item.parent_cp_ids) || item.parent_cp_ids.length === 0)) {
                return { ok:false, reason:'missing_parent_cp_ids' };
              }
              if (coordinatorCore.hasVerifiedAllocationProvenance(state, issue.number, item)) return { ok:true, verified:true };
              const validation = coordinatorCore.validateAllocationProvenance(state, item, issue.number, issue.created_at, nowMs);
              if (!validation.ok) return validation;
              coordinatorCore.recordAllocationProvenance(state, issue.number, item, nowMs);
              return { ok:true, verified:true, recorded:true };
            };
            const rawWorkItemForIssue = issue => {
              const match = (issue.body || '').match(/(?:^|\n)###\s*Work item specification JSON\s*\n([\s\S]*?)(?=\n###|$)/i);
              if (!match) return null;
              const raw = match[1].trim().replace(/^\x60{3}(?:json)?\s*/i, '').replace(/\s*\x60{3}$/, '');
              try { return JSON.parse(raw); } catch (_) { return null; }
            };
            const allTaskIssues = async () => github.paginate(github.rest.issues.listForRepo, { owner, repo, state: 'all', per_page: 100 });
            const findDuplicateWorkItemIdIssuesForIssue = async (issue, item, state, issues) => {
              const records = issues.filter(isTask).map(other => {
                const raw = rawWorkItemForIssue(other) || {};
                return { ...raw, number: other.number, issue_number: other.number, work_item_id: raw.work_item_id || null };
              });
              const registryRecords = Object.entries(state.work_items || {}).map(([number, saved]) => ({ ...saved, issue_number: Number(number) }));
              return workItemCore.findDuplicateWorkItemIdIssues(issue.number, item, records, registryRecords);
            };
            const allWorkItemsFor = async (state, issues) => {
              const records = new Map();
              for (const liveIssue of issues.filter(isTask)) {
                const raw = rawWorkItemForIssue(liveIssue);
                if (!raw || !raw.work_item_id) continue;
                const stored = state.work_items && state.work_items[liveIssue.number];
                let resolved = raw;
                try {
                  const validated = workItemSpecFor(liveIssue);
                  if (stored) {
                    const resources = value => [...new Set((value || []).map(x => String(x).trim().toLowerCase().replace(/\\/g, '/')))].sort();
                    const same = stored.work_item_id === validated.work_item_id &&
                      stored.write_policy === validated.write_policy &&
                      stored.target_repository === validated.target_repository &&
                      (stored.owner_approval_ref || '') === (validated.owner_approval_ref || '') &&
                      (stored.parent_work_item_id || null) === (validated.parent_work_item_id || null) &&
                      JSON.stringify(resources(stored.resource_keys)) === JSON.stringify(resources(validated.resource_keys));
                    resolved = same ? { ...stored, parent_work_item_id: validated.parent_work_item_id } : { ...raw, status: 'INVALID' };
                  } else resolved = validated;
                } catch (_) {
                  resolved = { ...raw, status: 'INVALID' };
                }
                records.set(liveIssue.number, resolved);
              }
              for (const number in (state.work_items || {})) if (!records.has(Number(number))) records.set(Number(number), state.work_items[number]);
              return [...records.values()];
            };
            const savedWorkItemFor = (state, issue) => {
              // Revalidate the live Issue on every command so owner authorization cannot be
              // silently removed or changed after a Work Item was first saved in the registry.
              const liveSpec = workItemSpecFor(issue);
              const stored = state.work_items && state.work_items[issue.number];
              const item = stored || liveSpec;
              if (!item) return null;
              if (!liveSpec && stored &&
                stored.target_repository === 'a4adelahmadian86-wq/non' &&
                stored.write_policy === 'WRITE_ALLOWED') {
                throw new Error('Owner-authorized NON Work Item requires a live Issue specification');
              }
              if (liveSpec && (
                item.work_item_id !== liveSpec.work_item_id ||
                item.write_policy !== liveSpec.write_policy ||
                item.target_repository !== liveSpec.target_repository ||
                (item.owner_approval_ref || '') !== (liveSpec.owner_approval_ref || '') ||
                JSON.stringify([...new Set((item.resource_keys || []).map(x => String(x).trim().toLowerCase().split(String.fromCharCode(92)).join('/')))].sort()) !==
                  JSON.stringify([...new Set((liveSpec.resource_keys || []).map(x => String(x).trim().toLowerCase().split(String.fromCharCode(92)).join('/')))].sort())
              )) throw new Error('Saved Work Item identity/policy/resources do not match live Issue');
              item.write_policy ||= 'READ_ONLY';
              item.priority_source ||= 'DEFAULT_POLICY';
              const byId = new Map();
              for (const saved of Object.values(state.work_items || {})) {
                const matches = byId.get(saved.work_item_id) || [];
                matches.push(saved);
                byId.set(saved.work_item_id, matches);
              }
              item.dependencies = (item.dependencies || []).map(dep => {
                const matches = byId.get(dep.work_item_id) || [];
                return { ...dep, status: matches.length === 1 ? matches[0].status : 'UNKNOWN' };
              });
              return item;
            };

            const handleCommand = async (issue, comment, snapshot) => {
              const state = snapshot.state;
              const id = String(comment.id);
              if (state.processed_operations?.[id]) return snapshot;
              const match = comment.body.match(/^\s*\/farast\s+(claim|heartbeat|release|status|progress|step|criterion|checkpoint|block|unblock|review|reopen|accept|refresh)\b([\s\S]*)$/i);
              if (!match) return snapshot;
              const command = match[1].toLowerCase();
              const args = parseArgs(match[2]);
              const actor = comment.user?.login || 'unknown';
              const chat = args.chat || '';
              const run = args.run || '';
              const lease = Number(args.lease || 30);
              const token = Number(args.token || 0);
              let response = '';
              let nextStatus = null;
              let acceptanceLineageMode = null;
              let acceptanceAudit = null;

              if (!allowedAssociations.has(comment.author_association) || !coordinatorCore.isCommandAllowed(authorizationPolicy, actor, comment.author_association, command, { targetRepository: targetRepositoryFor(issue), resourceKeys: resourcesFor(issue) })) {
                const role = coordinatorCore.roleForActor(authorizationPolicy, actor, comment.author_association) || 'UNASSIGNED';
                response = 'فرمان رد شد: نقش ' + role + ' اجازه اجرای فرمان /farast ' + command + ' را ندارد یا حساب در مخزن مجاز نیست. تغییر نقش فقط با تأیید مالک و در ACTOR_AUTHORIZATION.json انجام می‌شود.';
              } else {
                expireLocks(state);
                const current = activeForIssue(state, issue.number);
                const owned = coordinatorCore.ownsLease(current, actor, chat, run, token);
                let taskIssuesSnapshot = null;
                let duplicateWorkItemIds = [];
                let duplicateCheckError = '';
                let candidateWorkItemId = '';
                let candidateWorkItem = null;
                if (['claim','refresh','unblock','reopen','accept'].includes(command)) {
                  let candidate = null;
                  try { candidate = workItemSpecFor(issue); } catch (_) {}
                  if (candidate) {
                    candidateWorkItem = candidate;
                    candidateWorkItemId = candidate.work_item_id;
                    try {
                      taskIssuesSnapshot = await allTaskIssues();
                      duplicateWorkItemIds = await findDuplicateWorkItemIdIssuesForIssue(issue, candidate, state, taskIssuesSnapshot);
                    } catch (error) {
                      duplicateCheckError = String(error.message || error).slice(0, 240);
                    }
                  }
                }
                const allocationGate = ['claim','refresh','unblock','reopen','accept'].includes(command)
                  ? ensureAllocationProvenance(issue, candidateWorkItem, state)
                  : { ok:true };
                if (!allocationGate.ok) {
                  nextStatus = 'blocked';
                  response = 'فرمان رد شد: تخصیص این Work Item با lease معتبر Issue #11 قابل اثبات نیست؛ ' + allocationGate.reason + '. ابتدا فقط از مسیر allocator مجاز و با provenance دقیق اقدام کنید.';
                } else if (duplicateCheckError) {
                  nextStatus = 'blocked';
                  response = 'فرمان رد شد: یکتایی WORK_ITEM_ID قابل راستی‌آزمایی نیست؛ برای fail-closed بودن هیچ Claim/refresh/unblock/accept انجام نشد. ' + duplicateCheckError;
                } else if (duplicateWorkItemIds.length) {
                  nextStatus = 'blocked';
                  response = 'فرمان رد شد: WORK_ITEM_ID=' + candidateWorkItemId + ' در Issueهای دیگری نیز ثبت شده است: ' + duplicateWorkItemIds.map(n=>'#'+n).join(',') + '; تا رفع تکرار، هیچ Claim/refresh/unblock/accept مجاز نیست.';
                } else if (command === 'refresh') {
                  if (current.length) {
                    response = 'Refresh رد شد: ابتدا lease فعال باید با فرمان release معتبر آزاد شود.';
                  } else {
                    const fresh = workItemSpecFor(issue);
                    const previous = state.work_items?.[issue.number];
                    if (!fresh) {
                      response = 'Refresh رد شد: Work Item JSON معتبر در بدنه Issue وجود ندارد.';
                    } else if (previous && previous.work_item_id !== fresh.work_item_id) {
                      response = 'Refresh رد شد: WORK_ITEM_ID تغییر کرده است؛ شناسه پایدار را عوض نکن.';
                    } else {
                      const oldSteps = new Map((previous?.steps || []).map(x => [x.step_id, x]));
                      const oldCriteria = new Map((previous?.acceptance_criteria || []).map(x => [x.criterion_id, x]));
                      fresh.steps = fresh.steps.map(step => {
                        const old = oldSteps.get(step.step_id);
                        return old ? { ...step, validation_status: old.validation_status, evidence_refs: old.evidence_refs, validated_at_utc: old.validated_at_utc, validated_by: old.validated_by, validation_note: old.validation_note } : step;
                      });
                      fresh.acceptance_criteria = fresh.acceptance_criteria.map(criterion => {
                        const old = oldCriteria.get(criterion.criterion_id);
                        return old ? { ...criterion, validation_status: old.validation_status, evidence_refs: old.evidence_refs, validated_at_utc: old.validated_at_utc, validated_by: old.validated_by, validation_note: old.validation_note } : criterion;
                      });
                      const p = workItemCore.calculateProgress(fresh);
                      const hardGate = workItemCore.evaluateHardGates(fresh, dependencyGraph, [...Object.values(state.work_items || {}).filter(x => x.work_item_id !== fresh.work_item_id), fresh]);
                      fresh.status = workItemCore.refreshedStatus(previous?.status, p, hardGate.ready);
                      state.work_items ||= {};
                      state.work_items[issue.number] = fresh;
                      state.history ||= [];
                      state.history.push({ event: 'WORK_ITEM_REFRESHED', issue_number: issue.number, work_item_id: fresh.work_item_id, actor, preserved_steps: p.verified_steps, preserved_criteria: p.verified_criteria, hard_gate_ready: hardGate.ready, hard_gate_blockers: hardGate.blockers, at_utc: new Date().toISOString() });
                      nextStatus = !hardGate.ready ? 'blocked' : fresh.status === 'REVIEW_REQUIRED' ? 'review' : 'ready';
                      response = 'Work Item specification refreshed from Issue body; preserved_steps=' + p.verified_steps + '; preserved_criteria=' + p.verified_criteria + '; hard_gates=' + (hardGate.ready ? 'PASS' : 'BLOCKED:' + hardGate.blockers.join(',')) + '; EXECUTION_PROGRESS=' + p.execution_percentage + '%; ACCEPTANCE_PROGRESS=' + p.acceptance_percentage + '%; OVERALL_COMPLETION=' + p.overall_completion_percentage + '%.';
                    }
                  }
                } else if (command === 'claim') {
                  if (!coordinatorCore.isSafeRunId(chat) || !coordinatorCore.isSafeRunId(run) || !Number.isFinite(lease) || lease < 5 || lease > 120) {
                    response = 'Claim رد شد. قالب: /farast claim chat=شناسه run=شناسه lease=30 (۵ تا ۱۲۰ دقیقه).';
                  } else if (['agent:blocked','agent:review','agent:done'].some(x => labelsOf(issue).includes(x))) {
                    response = 'Claim رد شد: وضعیت وظیفه blocked/review/done است؛ ابتدا تصمیم مجاز لازم است.';
                  } else {
                    const keys = resourcesFor(issue);
                    const targetRepository = targetRepositoryFor(issue);
                    // Resolve policy from the live Issue JSON, never from a potentially stale registry snapshot.
                    // Any policy/target/resource disagreement fails closed until an owner refresh reconciles it.
                    let writePolicy = 'READ_ONLY';
                    let policyError = '';
                    let liveWorkItem = null;
                    try {
                      liveWorkItem = workItemSpecFor(issue);
                      const storedWorkItem = state.work_items?.[issue.number];
