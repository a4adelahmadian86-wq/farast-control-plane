                        else if (baseBranchProtectionError) response = 'ادغام متوقف شد: ' + baseBranchProtectionError;
                        else if (checkRunsError) response = 'پذیرش خودکار متوقف شد: خواندن Check Runها ممکن نشد. مخزن هدف باید public باشد تا Checks API بدون احراز هویت خوانده شود؛ برای مخزن private، GitHub App installation token با Checks:read لازم است. جزئیات: ' + checkRunsError;
                        else if (!automatedChecksPassed) response = 'پذیرش خودکار رد شد: تمام Check Runها و Commit Statusهای SHA دقیق head باید با conclusion/state برابر success تکمیل شده باشند؛ بازبین انسانی دوم لازم نیست.';
                        else if (acceptanceItem && !acceptanceProgress.can_merge) response = 'ادغام متوقف شد: پیش از merge همه گام‌ها، معیارهای PRE_MERGE و dependencyها باید با evidence معتبر PASS باشند؛ EXECUTION_PROGRESS=' + acceptanceProgress.execution_percentage + '%; ACCEPTANCE_PROGRESS=' + (acceptanceProgress.acceptance_percentage === null ? 'N/A' : acceptanceProgress.acceptance_percentage + '%') + '; OVERALL_COMPLETION=' + (acceptanceProgress.overall_completion_percentage === null ? 'N/A' : acceptanceProgress.overall_completion_percentage + '%') + '.';
                        else {
                          let mergeConfirmed = pr.merged;
                          if (!mergeConfirmed) {
                            try {
                              const mergeResponse = await prClient.rest.pulls.merge({ owner: prOwner, repo: prRepo, pull_number: Number(prNumber), sha: pr.head.sha });
                              mergeConfirmed = mergeResponse.data.merged === true;
                            } catch (mergeError) {
                              response = 'ادغام خودکار انجام نشد؛ GitHub merge را رد کرد: ' + String(mergeError.message || mergeError).slice(0, 300);
                            }
                          }
                          if (!mergeConfirmed) {
                            if (!response) response = 'ادغام خودکار تأیید نشد؛ PR باز می‌ماند و پذیرش انجام نمی‌شود.';
                          } else {
                            if (acceptanceItem) {
                              state.work_items ||= {};
                              state.work_items[issue.number] ||= acceptanceItem;
                              if (acceptanceProgress.can_accept) {
                                state.work_items[issue.number].status = 'ACCEPTED';
                                nextStatus = 'done';
                                response = 'Work Item ACCEPTED: همه گام‌ها و معیارهای اجباری، از جمله معیارهای POST_MERGE، با evidence معتبر پاس شدند؛ PR ادغام‌شده و تمام گیت‌های ماشینی موفق روی SHA دقیق head احراز شد؛ هیچ Review انسانی شرط پذیرش نیست.' + (acceptanceLineageMode === 'MERGED_REPLACEMENT_ANCESTOR' ? ' lineage از طریق PR جایگزین ادغام‌شده و ancestry تأییدشده احراز شد.' : '');
                              } else {
                                state.work_items[issue.number].status = 'REVIEW_REQUIRED';
                                nextStatus = 'review';
                                response = 'PR ادغام شد، اما Work Item هنوز ACCEPTED نیست؛ معیارهای POST_MERGE باید پس از ادغام با evidence معتبر PASS شوند. وضعیت review حفظ شد و پذیرش نهایی تا تکمیل آن معیارها ممنوع است.';
                              }
                            } else {
                              nextStatus = 'done';
                              response = 'پذیرش تأیید شد: PR به‌صورت خودکار ادغام شد و تمام گیت‌های ماشینی موفق روی SHA دقیق head احراز شد؛ هیچ Review انسانی شرط پذیرش نیست.';
                            }
                          }
                        }
                      }
                    }
                  }
                }
              }

              state.processed_operations ||= {};
              state.processed_operations[id] = { response, response_posted: false, issue_number: issue.number, actor, command, next_status: nextStatus, ...(acceptanceAudit || {}), at_utc: new Date().toISOString() };
              const updated = await saveRegistry(state, snapshot, 'FARAST coordinator: ' + command + ' issue #' + issue.number + ' operation ' + id);
              if (nextStatus) await setStatus(issue.number, nextStatus);
              if (command === 'reopen' && nextStatus === 'ready') await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'open', state_reason: 'reopened' });
              if (nextStatus === 'done') await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
              const marker = coordinatorCore.responseMarker(id);
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issue.number, per_page: 100 });
              if (!comments.some(c => c.body.includes(marker))) await publish(issue.number, response + '\n\n' + marker);
              const latest = updated?.state;
              const durableOperation = latest?.processed_operations?.[id];
              if (!durableOperation) throw new Error('durable_processed_operation_missing:' + id + '; scheduled reconciliation must retry');
              durableOperation.response_posted = true;
              return await saveRegistry(latest, updated, 'FARAST coordinator: record response for operation ' + id);
            };

            const processIssue = async (issue, limits = {}) => {
              if (!isTask(issue)) return;
              issue = (await github.rest.issues.get({ owner, repo, issue_number: issue.number })).data;
              if (!isTask(issue)) return;
              if (!labelsOf(issue).includes('agent:task')) await addLabel(issue.number, 'agent:task');
              let snapshot = await getRegistry();
              const accepted = coordinatorCore.latestTaskStatus(snapshot.state.processed_operations, issue.number) === 'done';
              if (!accepted && labelsOf(issue).includes('agent:done')) {
                await removeLabel(issue.number, 'agent:done');
                issue = (await github.rest.issues.get({ owner, repo, issue_number: issue.number })).data;
              }
              if (issue.state === 'open' && accepted) {
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
                issue = (await github.rest.issues.get({ owner, repo, issue_number: issue.number })).data;
              }
              if (issue.state === 'closed' && !accepted) {
                await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'open', state_reason: 'reopened' });
                await publish(issue.number, 'إغلاق رد شد: دروازه پذیرش مستقل کامل نشده است. برای پذیرش از /farast accept pr=... استفاده کنید.');
                return;
              }
              const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number: issue.number, per_page: 100 });
              const expiredLeases = expireLocks(snapshot.state);
              if (expiredLeases.length) snapshot = await saveRegistry(snapshot.state, snapshot, 'FARAST coordinator: expire stale leases');
              // Reconcile blocked children automatically when their exact dependencies become ACCEPTED.
              const activeLocksForIssue = snapshot.state.locks.filter(lock => {
                if (lock.issue_number !== issue.number) return false;
                const expiry = Date.parse(lock.lease_expires_at_utc);
                return !Number.isFinite(expiry) || expiry > Date.now();
              });
              if (issue.state === 'open' && labelsOf(issue).includes('agent:blocked') && activeLocksForIssue.length === 0) {
                const fresh = workItemSpecFor(issue), previous = snapshot.state.work_items?.[issue.number];
                const allocationGate = fresh
                  ? ensureAllocationProvenance(issue, fresh, snapshot.state)
                  : { ok:false, reason:'work_item_spec_missing' };
                if (fresh && allocationGate.ok && (!previous || previous.work_item_id === fresh.work_item_id)) {
                  const oldSteps = new Map((previous?.steps || []).map(x => [x.step_id, x]));
                  const oldCriteria = new Map((previous?.acceptance_criteria || []).map(x => [x.criterion_id, x]));
                  fresh.steps = fresh.steps.map(step => {
                    const old = oldSteps.get(step.step_id);
                    return old ? { ...step, validation_status: old.validation_status, evidence_refs: old.evidence_refs, validated_at_utc: old.validated_at_utc, validated_by: old.validated_by, validation_note: old.validation_note } : step;
                  });
                  fresh.acceptance_criteria = fresh.acceptance_criteria.map(criterion => {
                    const old = oldCriteria.get(criterion.criterion_id);
                    return old ? { ...criterion, validation_status: old.validation_status, evidence_refs: old.evidence_refs, validated_at_utc: old.validated_at_utc, validated_by: old.validated_by, validation_note: old.validation_note } : criterion;
                  });
                  const candidates = [...Object.values(snapshot.state.work_items || {}).filter(x => x.work_item_id !== fresh.work_item_id), fresh];
                  const gate = workItemCore.evaluateHardGates(fresh, dependencyGraph, candidates);
                  if (gate.ready) {
                    const progress = workItemCore.calculateProgress(fresh);
                    fresh.status = 'READY';
                    snapshot.state.work_items ||= {};
                    snapshot.state.work_items[issue.number] = fresh;
                    snapshot.state.history ||= [];
                    snapshot.state.history.push({ event: 'DEPENDENCY_AUTO_UNBLOCKED', issue_number: issue.number, work_item_id: fresh.work_item_id, preserved_steps: progress.verified_steps, at_utc: new Date().toISOString() });
                    snapshot = await saveRegistry(snapshot.state, snapshot, 'FARAST coordinator: auto-unblock Issue #' + issue.number);
                    await setStatus(issue.number, 'ready');
                    issue = (await github.rest.issues.get({ owner, repo, issue_number: issue.number })).data;
                  }
                }
              }
              // Recover responses that were committed but not posted before an interruption.
              for (const [id, op] of coordinatorCore.pendingResponseOperations(snapshot.state.processed_operations, issue.number).slice(0, limits.maxPendingResponsesPerIssue || inboxScheduler.MAX_PENDING_RESPONSES_PER_ISSUE)) {
                if (op.next_status) await setStatus(issue.number, op.next_status);
                if (op.next_status === 'done' && issue.state !== 'closed') await github.rest.issues.update({ owner, repo, issue_number: issue.number, state: 'closed', state_reason: 'completed' });
                const marker = coordinatorCore.responseMarker(id);
                if (!comments.some(c => c.body.includes(marker))) await publish(issue.number, op.response + '\n\n' + marker);
                snapshot.state.processed_operations[id].response_posted = true;
                snapshot = await saveRegistry(snapshot.state, snapshot, 'FARAST coordinator: recover response ' + id);
              }
              const selectedCommandIds = new Set(inboxScheduler.selectPendingCommandComments(comments, snapshot.state.processed_operations, limits.maxCommandsPerIssue || inboxScheduler.MAX_COMMANDS_PER_ISSUE).map(comment => String(comment.id)));
              for (const comment of coordinatorCore.pendingCommandComments(comments, snapshot.state.processed_operations).filter(comment => selectedCommandIds.has(String(comment.id)))) {
                const operationId = String(comment.id);
                // The durable inbox helper deduplicates comment IDs and excludes committed operations.
                snapshot = await handleCommand(issue, comment, snapshot);
                issue = (await github.rest.issues.get({ owner, repo, issue_number: issue.number })).data;
              }
              const current = snapshot.state.locks.filter(x => x.issue_number === issue.number && Date.parse(x.lease_expires_at_utc) > Date.now());
              if (current.length && !labelsOf(issue).includes('agent:locked')) await setStatus(issue.number, 'locked');
              else if (!current.length && !['agent:blocked','agent:review','agent:done'].some(x => labelsOf(issue).includes(x)) && !labelsOf(issue).includes('agent:ready')) await setStatus(issue.number, 'ready');
            };

            try {
              if (context.eventName === 'issues' && ['opened','reopened'].includes(context.payload.action)) {
                const issue = context.payload.issue;
                if (isTask(issue)) {
                  await addLabel(issue.number, 'agent:task');
                  if (Number(issue.number) > LEGACY_ALLOCATION_PROVENANCE_MAX_ISSUE) {
                    await setStatus(issue.number, 'blocked');
                    const snapshot = await getRegistry();
                    let item = null;
                    let gate;
                    try {
                      item = workItemSpecFor(issue);
                      gate = ensureAllocationProvenance(issue, item, snapshot.state);
                    } catch (error) {
                      gate = { ok:false, reason:String(error.message || error).slice(0, 300) };
                    }
                    if (gate.ok) {
                      await saveRegistry(snapshot.state, snapshot, 'FARAST coordinator: verify allocator provenance for Issue #' + issue.number);
                      await setStatus(issue.number, 'ready');
                    } else {
                      snapshot.state.history ||= [];
                      const alreadyRejected = snapshot.state.history.some(entry =>
                        entry.event === 'WORK_ITEM_ALLOCATION_REJECTED' &&
                        Number(entry.issue_number) === Number(issue.number) &&
                        entry.reason === gate.reason
                      );
                      if (!alreadyRejected) snapshot.state.history.push({
                        event:'WORK_ITEM_ALLOCATION_REJECTED',
                        issue_number:Number(issue.number),
                        work_item_id:item?.work_item_id || null,
                        reason:gate.reason || 'unknown',
                        at_utc:new Date().toISOString()
                      });
                      await saveRegistry(snapshot.state, snapshot, 'FARAST coordinator: reject invalid allocation provenance for Issue #' + issue.number);
                      await setStatus(issue.number, 'blocked');
                      const marker = '<!-- FARAST_ALLOCATION_PROVENANCE_REJECTED:' + issue.number + ' -->';
                      const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number:issue.number, per_page:100 });
                      if (!comments.some(comment => comment.body.includes(marker))) {
                        await publish(issue.number, 'Work Item BLOCKED: allocation_provenance is missing, stale or does not match the active allocator Issue #11 lease. No claim is permitted until exact allocator provenance is supplied and verified. Reason: ' + (gate.reason || 'unknown') + '\n\n' + marker);
                      }
                    }
                  } else if (!['agent:blocked','agent:review','agent:done'].some(x => labelsOf(issue).includes(x))) {
                    await addLabel(issue.number, 'agent:ready');
                  }
                }
              }
  
              // One event Issue gets priority, then every trigger scans one bounded page from the
              // durable global cursor. A single noisy Issue can consume at most one command per run.
            } catch (issueEventError) {
              console.error('FARAST issue-opened processing deferred; the durable inbox will retry: ' + String(issueEventError.message || issueEventError));
            }

            const safelyProcessIssue = async issue => {
              try {
                await processIssue(issue);
              } catch (error) {
                console.error('FARAST inbox processing failed for Issue #' + issue.number + ': ' + String(error.message || error));
                // A rate-limited GitHub installation cannot safely perform a second registry read/write here.
                // Leave the command in the durable inbox; the next scheduled sweep will retry it.
                try {
                  const failedSnapshot = await getRegistry();
                  inboxScheduler.recordIssueError(failedSnapshot.state, issue.number, error);
                  await saveRegistry(failedSnapshot.state, failedSnapshot, 'FARAST coordinator: record inbox processing error #' + issue.number);
                } catch (recordError) {
                  console.error('FARAST could not persist the processing error because the GitHub API is unavailable: ' + String(recordError.message || recordError));
                }
              }
            };

            // Comment/open/reopen events process only their own Issue. A global page sweep is
            // reserved for scheduled/manual recovery so command bursts do not exhaust the installation API quota.
            const eventIssue = context.payload.issue || null;
            const dispatchIssueNumber = context.eventName === 'workflow_dispatch'
              ? Number(context.payload.inputs?.issue_number || 0)
              : 0;
            if (dispatchIssueNumber > 0) {
              const retryCommentId = String(context.payload.inputs?.retry_comment_id || '').trim();
              if (retryCommentId) {
                if (context.actor !== owner) throw new Error('Exact command replay is owner-only');
                const commentId = Number(retryCommentId);
                if (!Number.isSafeInteger(commentId) || commentId <= 0) throw new Error('Invalid retry_comment_id');
                const comment = (await github.rest.issues.getComment({ owner, repo, comment_id: commentId })).data;
                if (comment.user?.login !== owner || !comment.body?.match(/^\s*\/farast\s+accept\b/i)) {
                  throw new Error('Replay requires an existing owner-authored /farast accept comment');
                }
                if (!comment.issue_url?.endsWith('/issues/' + dispatchIssueNumber)) {
                  throw new Error('Replay comment does not belong to the targeted Issue');
                }
                const replaySnapshot = await getRegistry();
                const previous = replaySnapshot.state.processed_operations?.[retryCommentId];
                if (!previous || previous.issue_number !== dispatchIssueNumber || previous.command !== 'accept' ||
                    !String(previous.response || '').includes('ruleset_bypass_actors_not_visible')) {
                  throw new Error('Replay is allowed only for the exact previously blocked ruleset-visibility acceptance');
                }
                replaySnapshot.state.replayed_operations ||= {};
                replaySnapshot.state.replayed_operations[retryCommentId] = {
                  ...previous,
                  replayed_at_utc: new Date().toISOString(),
                  replayed_by: context.actor,
                  reason: 'owner-triggered exact-branch recovery after privileged ruleset-read workflow was installed'
                };
                delete replaySnapshot.state.processed_operations[retryCommentId];
                await saveRegistry(replaySnapshot.state, replaySnapshot, 'FARAST coordinator: archive blocked acceptance before owner-authorized replay');
              }
              const targetedIssue = (await github.rest.issues.get({
                owner, repo, issue_number: dispatchIssueNumber
              })).data;
              await safelyProcessIssue(targetedIssue);
            } else if (eventIssue && context.eventName !== 'schedule') {
              await safelyProcessIssue(eventIssue);
            } else if (context.eventName === 'schedule' || context.eventName === 'workflow_dispatch') {
              try {
                const cursorSnapshot = await getRegistry();
                const inboxPage = inboxScheduler.getCursorPage(cursorSnapshot.state);
                const pageResponse = await github.rest.issues.listForRepo({
                  owner, repo, state: 'open', per_page: inboxScheduler.PAGE_SIZE,
                  page: inboxPage, sort: 'created', direction: 'asc'
                });
                const targets = inboxScheduler.selectIssueBatch({
                  eventIssue: null,
                  pageIssues: pageResponse.data,
                  maxIssues: inboxScheduler.MAX_ISSUES_PER_BATCH
                });
                for (const issue of targets) await safelyProcessIssue(issue);

                const afterBatch = await getRegistry();
                const nextPage = inboxScheduler.nextCursorPage(inboxPage, pageResponse.data.length, inboxScheduler.PAGE_SIZE);
                if (nextPage !== inboxPage) {
                  inboxScheduler.advanceCursor(afterBatch.state, inboxPage, pageResponse.data.length);
                  await saveRegistry(afterBatch.state, afterBatch, 'FARAST coordinator: advance durable inbox cursor to page ' + nextPage);
                }
              } catch (sweepError) {
                console.error('FARAST scheduled inbox sweep deferred; the durable cursor is unchanged and the next schedule will retry: ' + String(sweepError.message || sweepError));
              }
            }
