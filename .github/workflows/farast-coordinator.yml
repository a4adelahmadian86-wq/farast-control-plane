name: FARAST durable multi-chat coordinator

on:
  issues:
    types: [opened, reopened, closed]
  issue_comment:
    types: [created]
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

# One writer for the entire control plane, not one writer per Issue.
# GitHub may replace a pending run; the durable comment inbox + scheduled
# reconciliation recovers commands that were not handled by the replaced run.
concurrency:
  group: farast-control-plane-single-writer
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  pull-requests: read

jobs:
  coordinate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Reconcile durable command inbox and central lock registry
        uses: actions/github-script@v7
        env:
          FARAST_GITHUB_TOKEN: ${{ secrets.FARAST_GITHUB_TOKEN }}
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const coordinatorCore = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/coordinator-core.js');
            const workItemCore = require(process.env.GITHUB_WORKSPACE + '/.github/scripts/work-item-core.js');
            const authorizationPolicy = require(process.env.GITHUB_WORKSPACE + '/04_COORDINATION/ACTOR_AUTHORIZATION.json');
            const registryBranch = 'coordination/locks';
            const crossRepoGithub = process.env.FARAST_GITHUB_TOKEN ? new github.constructor({ auth: process.env.FARAST_GITHUB_TOKEN }) : null;
            const registryPath = '04_COORDINATION/ACTIVE_LOCKS.json';
            const allowedAssociations = new Set(['OWNER', 'COLLABORATOR', 'MEMBER']);
            const labelDefs = [
              { name: 'agent:task', color: '1D4ED8', description: 'Canonical FARAST task record' },
              { name: 'agent:ready', color: '0E8A16', description: 'Ready for an authorized worker to claim' },
              { name: 'agent:locked', color: 'B60205', description: 'One or more central resource leases are active' },
              { name: 'agent:blocked', color: 'D93F0B', description: 'Blocked pending resolution' },
              { name: 'agent:review', color: 'FBCA04', description: 'Implementation complete; independent review required' },
              { name: 'agent:done', color: '5319E7', description: 'Accepted after merged PR and independent current-head approval' }
            ];

            for (const label of labelDefs) {
              try { await github.rest.issues.createLabel({ owner, repo, ...label }); }
              catch (e) { if (e.status !== 422) throw e; }
            }

            const getRegistry = async () => {
              const ref = await github.rest.git.getRef({ owner, repo, ref: 'heads/' + registryBranch });
              const commit = await github.rest.git.getCommit({ owner, repo, commit_sha: ref.data.object.sha });
              const tree = await github.rest.git.getTree({ owner, repo, tree_sha: commit.data.tree.sha, recursive: '1' });
              const entry = tree.data.tree.find(x => x.path === registryPath && x.type === 'blob');
              if (!entry) throw new Error('STOP: central lock registry missing');
              const blob = await github.rest.git.getBlob({ owner, repo, file_sha: entry.sha });
              const decoded = Buffer.from(blob.data.content, 'base64').toString('utf8');
              return { state: JSON.parse(decoded), refSha: ref.data.object.sha, treeSha: commit.data.tree.sha };
            };

            // This workflow is the sole authorized writer. Global Actions concurrency
            // serializes every mutation; workers must never write ACTIVE_LOCKS.json directly.
            const saveRegistry = async (state, snapshot, message) => {
              state.revision = (state.revision || 0) + 1;
              const blob = await github.rest.git.createBlob({
                owner, repo, content: JSON.stringify(state, null, 2) + '\n', encoding: 'utf-8'
              });
              const tree = await github.rest.git.createTree({
                owner, repo, base_tree: snapshot.treeSha,
                tree: [{ path: registryPath, mode: '100644', type: 'blob', sha: blob.data.sha }]
              });
              const commit = await github.rest.git.createCommit({
                owner, repo, message, tree: tree.data.sha, parents: [snapshot.refSha]
              });
              // If the ref moved unexpectedly, fail closed. Never retry blindly.
              await github.rest.git.updateRef({
                owner, repo, ref: 'heads/' + registryBranch, sha: commit.data.sha, force: false
              });
              return await getRegistry();
            };

            const labelsOf = issue => (issue.labels || []).map(x => typeof x === 'string' ? x : x.name);
            const isTask = issue => issue.title.startsWith('[FARAST-TASK]') || labelsOf(issue).includes('agent:task');
            const addLabel = (n, name) => github.rest.issues.addLabels({ owner, repo, issue_number: n, labels: [name] });
            const removeLabel = async (n, name) => {
              try { await github.rest.issues.removeLabel({ owner, repo, issue_number: n, name }); }
              catch (e) { if (e.status !== 404) throw e; }
            };
            const setStatus = async (issue, status) => {
              const n = typeof issue === 'number' ? issue : issue.number;
              for (const name of ['agent:ready','agent:locked','agent:blocked','agent:review','agent:done']) await removeLabel(n, name);
              if (status !== 'task') await addLabel(n, 'agent:' + status);
            };
            const publish = (n, body) => github.rest.issues.createComment({ owner, repo, issue_number: n, body });

            const parseArgs = s => {
              const out = {};
              for (const m of s.matchAll(/([a-z_]+)=("[^"]*"|'[^']*'|[^\s]+)/g)) out[m[1]] = m[2].replace(/^["']|["']$/g, '');
              return out;
            };
            const resourcesFor = issue => coordinatorCore.resourcesFor(issue.body, issue.number);
            const targetRepositoryFor = issue => coordinatorCore.targetRepositoryFor(issue.body);
            const activeForIssue = (state, n) => coordinatorCore.activeForIssue(state, n);
            const expireLocks = state => coordinatorCore.expireLocks(state);
            const workItemSpecFor = issue => {
              const match = (issue.body || '').match(/(?:^|\n)###\s*Work item specification JSON\s*\n([\s\S]*?)(?=\n###|$)/i);
              if (!match) return null;
              const raw = match[1].trim().replace(/^```(?:json)?\s*/i, '').replace(/\s*```$/, '');
              try {
                const item = JSON.parse(raw);
                workItemCore.validateWorkItem(item);
                const scalar = label => {
                  const body = issue.body || '';
                  const at = body.indexOf('### ' + label);
                  if (at < 0) return '';
                  const start = body.indexOf('\n', at) + 1;
                  const next = body.indexOf('\n###', start);
                  return body.slice(start, next < 0 ? undefined : next).trim();
                };
                const formId = scalar('Stable Work Item ID');
                const formTarget = targetRepositoryFor(issue);
                const formResources = resourcesFor(issue);
                const formGoals = scalar('Parent Goal IDs').split(/[\n,;]+/).map(x => x.trim()).filter(Boolean).sort();
                const formExps = scalar('Parent EXP IDs').split(/[\n,;]+/).map(x => x.trim()).filter(Boolean).sort();
                const formPriority = Number(scalar('Priority (0-100; lower is higher)'));
                const formWritePolicy = scalar('Write policy');
                const formPrioritySource = scalar('Priority source');
                const specResources = [...new Set((item.resource_keys || []).map(x => String(x).trim().toLowerCase().replace(/\\/g, '/')))].sort();
                if (formId && formId !== item.work_item_id) throw new Error('Stable Work Item ID does not match JSON');
                if (formTarget && formTarget !== item.target_repository) throw new Error('Target repository does not match JSON');
                if (JSON.stringify(formResources) !== JSON.stringify(specResources)) throw new Error('Resource keys do not match JSON');
                if (formGoals.length && JSON.stringify(formGoals) !== JSON.stringify([...(item.parent_goal_ids || [])].sort())) throw new Error('Parent Goal IDs do not match JSON');
                if (formExps.length && JSON.stringify(formExps) !== JSON.stringify([...(item.parent_exp_ids || [])].sort())) throw new Error('Parent EXP IDs do not match JSON');
                if (Number.isFinite(formPriority) && formPriority !== item.priority) throw new Error('Priority does not match JSON');
                if (formWritePolicy && formWritePolicy !== item.write_policy) throw new Error('Write policy does not match JSON');
                if (formPrioritySource && formPrioritySource !== item.priority_source) throw new Error('Priority source does not match JSON');
                if (item.target_repository === 'a4adelahmadian86-wq/non' && item.write_policy !== 'READ_ONLY') throw new Error('NON product repository is READ_ONLY until explicit owner authorization is recorded');
                if (item.write_policy !== 'READ_ONLY' && issue.user && issue.user.login !== owner) throw new Error('Only repository owner may create a write-enabled Work Item');
                if (item.write_policy === 'WRITE_REQUIRES_OWNER_APPROVAL' && !item.owner_approval_ref) throw new Error('Owner approval evidence reference is required');
                return item;
              } catch (error) {
                throw new Error('Invalid Work item specification JSON in Issue #' + issue.number + ': ' + error.message);
              }
            };
            const savedWorkItemFor = (state, issue) => {
              const item = (state.work_items && state.work_items[issue.number]) || workItemSpecFor(issue);
              if (!item) return null;
              item.write_policy ||= 'READ_ONLY';
              item.priority_source ||= 'DEFAULT_POLICY';
              const byId = new Map(Object.values(state.work_items || {}).map(x => [x.work_item_id, x]));
              item.dependencies = (item.dependencies || []).map(dep => ({ ...dep, status: (byId.get(dep.work_item_id) && byId.get(dep.work_item_id).status) || dep.status || 'UNKNOWN' }));
              return item;
            };

            const handleCommand = async (issue, comment, snapshot) => {
              const state = snapshot.state;
              const id = String(comment.id);
              if (state.processed_operations?.[id]) return snapshot;
              const match = comment.body.match(/^\s*\/farast\s+(claim|heartbeat|release|status|progress|step|criterion|checkpoint|block|unblock|review|reopen|accept)\b([\s\S]*)$/i);
              if (!match) return snapshot;
              const command = match[1].toLowerCase();
              const args = parseArgs(match[2]);
              const actor = comment.user?.login || 'unknown';
              const chat = args.chat || '';
              const run = args.run || '';
              const lease = Number(args.lease || 30);
              const token = Number(args.token || 0);
              let response = '';
              let nextStatus = null;

              if (!allowedAssociations.has(comment.author_association) || !coordinatorCore.isCommandAllowed(authorizationPolicy, actor, comment.author_association, command, { targetRepository: targetRepositoryFor(issue), resourceKeys: resourcesFor(issue) })) {
                const role = coordinatorCore.roleForActor(authorizationPolicy, actor, comment.author_association) || 'UNASSIGNED';
                response = 'فرمان رد شد: نقش ' + role + ' اجازه اجرای فرمان /farast ' + command + ' را ندارد یا حساب در مخزن مجاز نیست. تغییر نقش فقط با تأیید مالک و در ACTOR_AUTHORIZATION.json انجام می‌شود.';
              } else {
                expireLocks(state);
                const current = activeForIssue(state, issue.number);
                const owned = coordinatorCore.ownsLease(current, actor, chat, run, token);
                if (command === 'claim') {
                  if (!coordinatorCore.isSafeRunId(chat) || !coordinatorCore.isSafeRunId(run) || !Number.isFinite(lease) || lease < 5 || lease > 120) {
                    response = 'Claim رد شد. قالب: /farast claim chat=شناسه run=شناسه lease=30 (۵ تا ۱۲۰ دقیقه).';
                  } else if (['agent:blocked','agent:review','agent:done'].some(x => labelsOf(issue).includes(x))) {
                    response = 'Claim رد شد: وضعیت وظیفه blocked/review/done است؛ ابتدا تصمیم مجاز لازم است.';
                  } else {
                    const keys = resourcesFor(issue);
                    const targetRepository = targetRepositoryFor(issue);
                    const taskBranch = 'work/GH-' + issue.number + '-' + run.replace(/[^A-Za-z0-9._-]/g, '-');
                    if (!targetRepository) {
                      response = 'Claim رد شد: Target repository باید به‌صورت owner/name در Issue مشخص شود.';
                    } else {
                      const claim = coordinatorCore.claimResources(state, {
                        issueNumber: issue.number, taskId: 'GH-' + issue.number, actor,
                        chatId: chat, runId: run, targetRepository,
                        branch: taskBranch, resourceKeys: keys,
                        leaseMinutes: lease, nowMs: Date.now()
                      });
                      if (!claim.ok && claim.reason === 'task_already_claimed') {
                        const conflict = claim.conflict;
                        response = 'Claim رد شد: این TASK هم‌اکنون در اختیار @' + conflict.actor + ' با run=' + conflict.run_id + ' است؛ برای جلوگیری از دو نویسنده روی یک branch، ابتدا handoff یا انقضای lease لازم است.';
                      } else if (!claim.ok && claim.reason === 'branch_reuse') {
                        response = 'Claim رد شد: این RUN/branch قبلاً استفاده شده است؛ برای هر handoff یک RUN_ID جدید و یکتا انتخاب کن.';
                      } else if (!claim.ok && claim.reason === 'missing_resources') {
                        response = 'Claim رد شد: بخش Resource keys در Issue خالی است؛ کلیدهای دقیق منابع را اضافه و فرمان جدید ثبت کنید.';
                      } else if (!claim.ok && claim.reason === 'resource_conflict') {
                        const conflict = claim.conflict;
                        response = 'Claim رد شد: منبع ' + conflict.resource_key + ' در اختیار Issue #' + conflict.issue_number + ' / @' + conflict.actor + ' تا ' + conflict.lease_expires_at_utc + ' UTC است.';
                      } else if (claim.ok) {
                        const handoff = claim.previousRun ? '; previous_run=' + claim.previousRun.runId + '; previous_target_repository=' + claim.previousRun.targetRepository + '; previous_branch=' + claim.previousRun.branch : '; previous_run=none';
                        const workItem = savedWorkItemFor(state, issue);
                        let resumeText = '';
                        if (workItem) {
                          state.work_items ||= {};
                          state.work_items[issue.number] ||= workItem;
                          state.work_items[issue.number].status = 'CLAIMED';
                          const plan = workItemCore.resumePlan(state.work_items[issue.number]);
                          resumeText = '; WORK_ITEM_ID=' + plan.work_item_id + '; verified_steps=' + plan.completed_step_ids.join(',') + '; remaining_steps=' + plan.remaining_step_ids.join(',') + '; progress=' + plan.percentage + '%';
                        }
                        response = 'CLAIM GRANTED. TASK=GH-' + issue.number + resumeText + '; actor=@' + actor + '; chat=' + chat + '; run=' + run + '; resource_keys=' + claim.resourceKeys.join(',') + '; target_repository=' + targetRepository + '; branch=' + taskBranch + handoff + '; fencing_token=' + claim.fencingToken + '; lease_expires=' + claim.expiresAt + '. پیش از هر write و checkpoint، heartbeat را تمدید و token را بررسی کن. اگر previous_branch وجود دارد، branch جدید را از آخرین commit تأییدشده آن بساز؛ هرگز branch قبلی را تغییر نده.';
                        nextStatus = 'locked';
                      }
                    }
                  }
                } else if (command === 'status') {
                  response = current.length ? 'وضعیت: LOCKED؛ مالک @' + current[0].actor + '؛ chat=' + current[0].chat_id + '؛ run=' + current[0].run_id + '؛ token=' + current[0].fencing_token + '؛ expiry=' + current[0].lease_expires_at_utc : 'وضعیت: بدون lease فعال.';
                } else if (command === 'progress') {
                  const item = savedWorkItemFor(state, issue);
                  if (!item) response = 'Work item specification JSON معتبر در Issue ثبت نشده است.';
                  else {
                    state.work_items ||= {}; state.work_items[issue.number] ||= item;
                    const p = workItemCore.calculateProgress(state.work_items[issue.number]);
                    response = 'WORK_ITEM=' + item.work_item_id + '; progress=' + p.percentage + '%; verified_steps=' + p.verified_steps + '/' + p.total_steps + '; weighting=' + p.weighting_version + '; acceptance_criteria=' + (p.all_required_criteria_passed ? 'PASS' : 'INCOMPLETE') + '; dependencies=' + (p.dependencies_accepted ? 'PASS' : 'INCOMPLETE') + '; can_accept=' + p.can_accept + '. درصد پیشرفت به‌تنهایی پذیرش نیست.';
                  }
                } else if (['step','criterion','checkpoint'].includes(command)) {
                  const item = savedWorkItemFor(state, issue);
                  if (!item) response = 'Work item specification JSON معتبر در Issue ثبت نشده است.';
                  else if (!owned || !token) response = 'فرمان رد شد: lease معتبر نیست.';
                  else {
                    state.work_items ||= {}; state.work_items[issue.number] ||= item;
                    const saved = state.work_items[issue.number];
                    const evidence = (args.evidence || '').split(',').map(x => x.trim()).filter(Boolean);
                    if (command === 'step') {
                      const result = workItemCore.recordStepEvidence(saved, { lease: current[0], actor, chat_id: chat, run_id: run, fencing_token: token, step_id: args.step || '', validation_status: (args.result || '').toUpperCase(), evidence_refs: evidence, note: args.note || '', nowMs: Date.now() });
                      saved.status = 'IN_PROGRESS';
                      response = 'STEP ثبت شد: ' + args.step + '; progress=' + result.progress.percentage + '%; verified=' + result.progress.verified_steps + '/' + result.progress.total_steps + '.';
                    } else if (command === 'criterion') {
                      const result = workItemCore.recordCriterionEvidence(saved, { lease: current[0], actor, chat_id: chat, run_id: run, fencing_token: token, criterion_id: args.id || '', validation_status: (args.result || '').toUpperCase(), evidence_refs: evidence, note: args.note || '', nowMs: Date.now() });
                      response = 'معیار پذیرش ثبت شد: ' + args.id + '; can_accept=' + result.progress.can_accept + '; progress=' + result.progress.percentage + '%.';
                    } else {
                      const checkpoint = workItemCore.createCheckpoint(saved, { lease: current[0], actor, chat_id: chat, run_id: run, fencing_token: token, current_step_id: args.step || '', next_action: args.next_action || '', evidence_refs: evidence, blockers: args.blockers ? args.blockers.split(',') : [], nowMs: Date.now() });
                      state.checkpoints ||= {}; state.checkpoints[issue.number] = checkpoint;
                      response = 'CHECKPOINT ذخیره شد: WORK_ITEM=' + checkpoint.work_item_id + '; progress=' + checkpoint.progress_percentage + '%; next_action=' + checkpoint.next_action + '; remaining_steps=' + checkpoint.remaining_step_ids.join(',') + '.';
                    }
                  }
                } else if (['heartbeat','release','block','review'].includes(command)) {
                  if (!owned || !token) response = 'فرمان رد شد: actor/chat/run/token با lease فعال تطبیق ندارد؛ هیچ تغییری انجام نشد.';
                  else if (command === 'heartbeat') {
                    if (!Number.isFinite(lease) || lease < 5 || lease > 120) response = 'Heartbeat رد شد: lease باید بین ۵ تا ۱۲۰ دقیقه باشد.';
                    else {
                      const renewal = coordinatorCore.renewLease(current, lease, Date.now());
                      const expiry = renewal.expiresAt;
                      state.history.push({ event: 'HEARTBEAT', issue_number: issue.number, actor, chat_id: chat, run_id: run, fencing_token: token, branch: current[0]?.branch, target_repository: current[0]?.target_repository, lease_expires_at_utc: expiry, at_utc: renewal.heartbeatAt });
                      response = 'Lease تمدید شد تا ' + expiry + ' UTC؛ fencing_token=' + token + '.';
                    }
                  } else {
                    state.locks = state.locks.filter(x => !(x.issue_number === issue.number && x.actor === actor && x.chat_id === chat && x.run_id === run && x.fencing_token === token));
                    state.history.push({ event: command.toUpperCase(), issue_number: issue.number, actor, chat_id: chat, run_id: run, fencing_token: token, branch: current[0]?.branch, target_repository: current[0]?.target_repository, at_utc: new Date().toISOString() });
                    const workItem = savedWorkItemFor(state, issue);
                    if (workItem) {
                      state.work_items ||= {}; state.work_items[issue.number] ||= workItem;
                      if (command === 'block') state.work_items[issue.number].status = 'BLOCKED';
                      else if (command === 'review') state.work_items[issue.number].status = 'REVIEW_REQUIRED';
                      else if (command === 'release' && state.work_items[issue.number].status === 'CLAIMED') state.work_items[issue.number].status = 'READY';
                    }
                    nextStatus = command === 'block' ? 'blocked' : command === 'review' ? 'review' : 'ready';
                    response = command === 'release' ? 'Lease آزاد شد؛ وظیفه تکمیل‌شده محسوب نمی‌شود.' : command === 'block' ? 'وظیفه مسدود شد و lease آزاد شد.' : 'پیاده‌سازی برای بازبینی مستقل تحویل شد؛ این به معنی پذیرش نیست.';
                  }
                } else if (command === 'unblock' || command === 'reopen') {
                  if (current.length) response = 'فرمان رد شد: ابتدا lease فعال باید با مالکیت معتبر آزاد شود.';
                  else if (command === 'unblock' && !labelsOf(issue).includes('agent:blocked')) response = 'وظیفه blocked نیست.';
                  else if (command === 'reopen' && !['agent:review','agent:done'].some(x => labelsOf(issue).includes(x))) response = 'فقط وظیفه review/done قابل بازگشایی است.';
                  else { const workItem = savedWorkItemFor(state, issue); if (workItem) { state.work_items ||= {}; state.work_items[issue.number] ||= workItem; state.work_items[issue.number].status = 'READY'; } nextStatus = 'ready'; response = 'وظیفه به ready بازگشت؛ برای شروع دوباره claim لازم است.'; }
                } else if (command === 'accept') {
                  const prUrl = args.pr || (issue.body || '').match(/https:\/\/github\.com\/[^\s)]+\/pull\/\d+/)?.[0];
                  const prMatch = prUrl?.match(/github\.com\/([^/]+)\/([^/]+)\/pull\/(\d+)/);
                  if (!prMatch || !(issue.body || '').includes(prUrl)) response = 'پذیرش رد شد: لینک PR باید هم در بدنه Issue ثبت شده باشد و هم با pr= به فرمان accept داده شود.';
                  else {
                    const [__, prOwner, prRepo, prNumber] = prMatch;
                    const prClient = (prOwner === owner && prRepo === repo) ? github : crossRepoGithub;
                    if (!prClient) {
                      response = 'پذیرش انجام نشد: برای بررسی PR در مخزن دیگر، Secret با نام FARAST_GITHUB_TOKEN و دسترسی read به آن مخزن لازم است.';
                    } else {
                    const pr = (await prClient.rest.pulls.get({ owner: prOwner, repo: prRepo, pull_number: Number(prNumber) })).data;
                    const reviews = await prClient.paginate(prClient.rest.pulls.listReviews, { owner: prOwner, repo: prRepo, pull_number: Number(prNumber), per_page: 100 });
                    const reviewEvent = [...state.history].reverse().find(x => x.issue_number === issue.number && x.event === 'REVIEW');
                    const workerActor = reviewEvent?.actor;
                    const branchBound = coordinatorCore.matchesReviewLease(pr, reviewEvent);
                    const independent = coordinatorCore.hasIndependentApproval(reviews, pr, workerActor, actor);
                    if (!labelsOf(issue).includes('agent:review') || current.length) response = 'پذیرش رد شد: وظیفه باید در وضعیت review و بدون lease فعال باشد.';
                    else if (!branchBound) response = 'پذیرش رد شد: PR باید از branch و target repository ثبت‌شده در آخرین handoff همان lease ساخته شده باشد.';
                    else if (!pr.merged || !independent) response = 'پذیرش رد شد: PR باید merged باشد و approval مستقل روی head فعلی داشته باشد.';
                    else {
                      const workItem = savedWorkItemFor(state, issue);
                      if (workItem) {
                        state.work_items ||= {}; state.work_items[issue.number] ||= workItem;
                        const gate = workItemCore.calculateProgress(state.work_items[issue.number]);
                        if (!gate.can_accept) response = 'پذیرش Work Item رد شد: همه گام‌های اجباری، معیارهای پذیرش و dependencyها باید با evidence معتبر PASS شوند؛ progress=' + gate.percentage + '%.';
                        else { state.work_items[issue.number].status = 'ACCEPTED'; nextStatus = 'done'; response = 'Work Item ACCEPTED: همه گام‌ها و معیارهای اجباری با evidence معتبر پاس شده‌اند؛ PR ادغام‌شده و approval مستقل روی head فعلی نیز احراز شد.'; }
                      } else { nextStatus = 'done'; response = 'پذیرش تأیید شد: PR ادغام‌شده و approval مستقل روی head فعلی احراز شد.'; }
                    }
                    }
                  }
                }
              }

              state.processed_operations ||= {};
